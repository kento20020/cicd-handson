# =============================================================================
# Step 6 : タグを打つと、Docker イメージを GitHub Container Registry (GHCR) に公開
# -----------------------------------------------------------------------------
# コピー先 : .github/workflows/release.yml
#
#   cp steps/06-release-ghcr.yml .github/workflows/release.yml
#
# 使い方（ワークフローを main に入れたあと）:
#   git tag v0.1.0
#   git push origin v0.1.0
#   → Actions タブで "Release" が動く
#   → 成功すると ghcr.io/<あなたのユーザー名>/<リポジトリ名>:0.1.0 が公開される
#
# 注意:
#   - タグのバージョンは pyproject.toml の version と手で揃える(自動チェックはしていない)。
#   - 最初に公開したパッケージは「非公開(private)」で作られる。
#     誰でも pull できるようにするには、GitHub のプロフィール → Packages → 該当パッケージ →
#     Package settings → Change visibility で Public にする。
#     （一度 Public にすると、Private には戻せない）
#   - ghcr.io の URL は小文字のみ。docker/metadata-action v6 が自動で小文字にしてくれる
#     (GitHub のユーザー名に大文字が含まれていても大丈夫)。
# =============================================================================

name: Release

on:
  push:
    # v で始まるタグ(v0.1.0 や v1.2.3)が push されたときだけ動く。
    # ブランチへの push では動かない。
    tags: ["v*"]

# 既定の権限は「読み取りのみ」。書き込み権限が必要なジョブにだけ個別に足す（最小権限）。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # test : リリース前の門番。テストに通らないものはイメージにしない。
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 依存関係をインストールする
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: テストを実行する
        run: pytest

  # ---------------------------------------------------------------------------
  # image : Docker イメージをビルドして GHCR に push する
  # ---------------------------------------------------------------------------
  image:
    # test が成功したときだけ実行する。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # このジョブにだけ packages: write(パッケージの書き込み)を与える。
    # job に permissions を書くと、ワークフロー全体の設定は「置き換え」られる。
    # checkout のために contents: read も書き直す必要がある。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Buildx : Docker の高機能ビルダー。GitHub Actions のキャッシュ(type=gha)を使うために必要。
      - name: Buildx をセットアップする
        uses: docker/setup-buildx-action@v4

      # ghcr.io にログインする。
      #   username : この実行を起動したユーザー（github.actor）
      #   password : この実行専用に自動発行される一時トークン(GITHUB_TOKEN)。
      #              自分で Personal Access Token を作って登録する必要はない。
      #              上の permissions で packages: write を与えたので、push できる。
      - name: GHCR にログインする
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグ名やラベルを自動で作る。
      #   images : イメージ名。github.repository は "owner/repo"。小文字化はこのアクションがやってくれる。
      #   tags   : タグ v0.1.0 を push した場合 →
      #              type=semver,pattern={{version}}         → 0.1.0
      #              type=semver,pattern={{major}}.{{minor}} → 0.1
      #            さらに semver のタグでは latest も自動で付く。
      #            （{{major}} だけのタグは 0.x の間は付かない仕様なので、ここでは使わない）
      #   labels : org.opencontainers.image.source などの標準ラベルを自動で付ける。
      #            source ラベルのおかげで、パッケージがこのリポジトリに自動で紐づく。
      - name: タグとラベルを生成する
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # ビルドして push する。
      #   context    : docker build の対象フォルダ（. = リポジトリのルート。Dockerfile がある場所）
      #   push       : true でレジストリに送る(false ならビルドだけ)
      #   tags/labels: 上の metadata-action が作った値をそのまま使う
      #   cache-from / cache-to : Docker のレイヤーキャッシュを GitHub Actions のキャッシュに保存・再利用。
      #                           mode=max は中間レイヤーも保存する(次回のビルドがより速くなる)。
      # 補足: 既定で「来歴(provenance)」という証明情報も一緒に push される。
      #       GHCR のパッケージページに "unknown/unknown" という項目が見えるのはそのため（異常ではない）。
      - name: ビルドして push する
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 実行結果ページ(Summary)に、公開したタグと pull コマンドを表示する。
      # 値は env 経由で渡す。${{ }} を run の中に直接書くと、タグ名のような外部入力が
      # シェルのコードとして解釈されてしまう(スクリプトインジェクション)ため。
      - name: 結果をサマリーに書く
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### 公開したイメージ"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "digest: \`$DIGEST\`"
            echo
            echo "pull の例: \`docker pull $(echo "$TAGS" | head -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
