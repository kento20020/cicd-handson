# =============================================================================
# Step 1 : いちばん小さな CI
# -----------------------------------------------------------------------------
# コピー先 : .github/workflows/ci.yml
#
#   mkdir -p .github/workflows
#   cp steps/01-ci-minimal.yml .github/workflows/ci.yml
#
# ねらい   : 「push したら、テストが自動で走る」を体験する。
#            Lint もキャッシュも並列化も、あえて入れない最小構成です。
#            Step 3 でこのファイルを丸ごと上書きして育てていきます。
# =============================================================================

# ワークフローの名前。GitHub の「Actions」タブや、PR のチェック欄にこの名前で出る。
name: CI

# --- いつ動かすか（トリガー） -------------------------------------------------
on:
  # push : コミットを push したときに動く。
  push:
    # "**" = すべてのブランチ。タグの push では動かさない。
    # 「*」で始まる文字列は YAML では特別な意味になるため、必ず引用符で囲む。
    branches: ["**"]
  # pull_request : PR を作ったとき・PR に追加コミットを push したときに動く。
  # 注意: PR を出しているブランチに push すると push と pull_request の両方が動き、
  #       同じテストが2回走る。これは Step 3 で整理する（わざと残してある）。
  pull_request:

# --- 何をするか ---------------------------------------------------------------
jobs:
  # ジョブの ID（好きな名前でよい）。1つのジョブは1台の使い捨て仮想マシンで動く。
  test:
    # 実行する仮想マシンの種類。2026年10月時点の ubuntu-latest は Ubuntu 24.04。
    # 公開リポジトリなら標準ランナーは無料（非公開リポジトリは月の無料枠を消費）。
    runs-on: ubuntu-latest

    # steps は上から順に実行される。1つでも失敗したら、そこで止まってジョブが赤くなる。
    steps:
      # 1) リポジトリのコードを仮想マシンに取得する。
      #    仮想マシンは毎回まっさらなので、これをしないとコードが1ファイルも無い。
      - uses: actions/checkout@v7

      # 2) Python を用意する。
      - uses: actions/setup-python@v7
        with:
          # 必ず文字列（引用符つき）で書く。引用符なしの 3.10 は数値の 3.1 と解釈されてしまう。
          # 3.14 は Step 3 でテストする 3 バージョン（3.13 / 3.14 / 3.15）の真ん中。
          python-version: "3.14"

      # 3) pip（パッケージ管理ツール）を最新にする。
      #    "python -m pip" と書くと、いま有効な Python に確実に結び付いた pip が動く。
      - name: pip を更新する
        run: python -m pip install --upgrade pip

      # 4) このプロジェクトと開発用ツール(pytest など)をインストールする。
      #    -e : 編集可能モード。src/ のコードをそのまま import できる。
      #    ".[dev]" : pyproject.toml の [project.optional-dependencies] の dev グループも入れる。
      - name: 依存関係をインストールする
        run: pip install -e ".[dev]"

      # 5) テストを実行する。pytest が1つでも失敗すると終了コードが 0 以外になり、
      #    ステップ（→ジョブ→ワークフロー）が失敗扱いになる。これが CI の「赤」の正体。
      - name: テストを実行する
        run: pytest
